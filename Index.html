
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Pop Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #15152f, #302b63);
    color: white;
    min-height: 100vh;
    text-align: center;
    overflow: hidden;
}

header {
    padding: 20px;
}

h1 {
    font-size: 35px;
    color: #00f5ff;
    text-shadow: 0 0 15px #00f5ff;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px;
    flex-wrap: wrap;
}

.stat {
    background: #ffffff15;
    padding: 12px 22px;
    border-radius: 15px;
    border: 1px solid #ffffff30;
    font-size: 18px;
}

.stat span {
    color: #00f5ff;
    font-weight: bold;
}

button {
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    background: #00f5ff;
    color: #15152f;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    transform: scale(1.05);
}

#gameArea {
    position: relative;
    width: 90%;
    max-width: 700px;
    height: 420px;
    margin: 15px auto;
    background: #ffffff08;
    border: 2px solid #ffffff25;
    border-radius: 20px;
    overflow: hidden;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    animation: popIn 0.3s ease;
    box-shadow:
        inset -5px -8px 15px #00000040,
        0 0 15px currentColor;
}

.bubble::after {
    content: "";
    position: absolute;
    top: 18%;
    left: 20%;
    width: 25%;
    height: 25%;
    background: #ffffffb0;
    border-radius: 50%;
}

@keyframes popIn {
    from {
        transform: scale(0);
    }
    to {
        transform: scale(1);
    }
}

#message {
    font-size: 20px;
    margin: 15px;
    color: #ffffff;
}

@media(max-width: 600px) {
    h1 {
        font-size: 27px;
    }

    #gameArea {
        height: 55vh;
        min-height: 300px;
    }

    .stat {
        padding: 10px 15px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🫧 Bubble Pop</h1>
    <p>Pop the bubbles and make a high score!</p>
</header>

<div class="stats">
    <div class="stat">
        Score: <span id="score">0</span>
    </div>

    <div class="stat">
        Time: <span id="time">30</span>s
    </div>

    <div class="stat">
        Best: <span id="best">0</span>
    </div>
</div>

<button id="startBtn" onclick="startGame()">
    Start Game
</button>

<div id="gameArea"></div>

<div id="message">
    Press Start Game to play!
</div>

<script>
const gameArea = document.getElementById("gameArea");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const bestText = document.getElementById("best");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

let score = 0;
let time = 30;
let timer = null;
let bubbleTimer = null;
let playing = false;

let best = Number(localStorage.getItem("bubbleBest")) || 0;
bestText.textContent = best;

const colors = [
    "#ff4dff",
    "#00f5ff",
    "#ffe600",
    "#ff5e5e",
    "#7cff6b",
    "#a970ff"
];

function createBubble() {
    if (!playing) return;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const size = Math.floor(Math.random() * 45) + 35;

    const maxX = gameArea.clientWidth - size;
    const maxY = gameArea.clientHeight - size;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    const color = colors[
        Math.floor(Math.random() * colors.length)
    ];

    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.left = x + "px";
    bubble.style.top = y + "px";
    bubble.style.background = color;
    bubble.style.color = color;

    bubble.onclick = function() {
        if (!playing) return;

        score++;
        scoreText.textContent = score;

        bubble.remove();
        createBubble();
    };

    gameArea.appendChild(bubble);

    setTimeout(() => {
        if (bubble.parentNode) {
            bubble.remove();
        }
    }, 1800);
}

function startGame() {
    clearInterval(timer);
    clearInterval(bubbleTimer);

    score = 0;
    time = 30;
    playing = true;

    scoreText.textContent = score;
    timeText.textContent = time;

    message.textContent = "Pop as many bubbles as you can!";
    startBtn.textContent = "Restart Game";

    gameArea.innerHTML = "";

    createBubble();
    createBubble();
    createBubble();

    bubbleTimer = setInterval(() => {
        if (playing) {
            createBubble();
        }
    }, 450);

    timer = setInterval(() => {
        time--;
        timeText.textContent = time;

        if (time <= 0) {
            endGame();
        }
    }, 1000);
}

function endGame() {
    playing = false;

    clearInterval(timer);
    clearInterval(bubbleTimer);

    gameArea.innerHTML = "";

    if (score > best) {
        best = score;

        localStorage.setItem("bubbleBest", best);
        bestText.textContent = best;

        message.textContent =
            "🎉 New High Score! Your Score: " + score;
    } else {
        message.textContent =
            "⏰ Game Over! Your Score: " + score;
    }

    startBtn.textContent = "Play Again";
}
</script>

</body>
  </html>
